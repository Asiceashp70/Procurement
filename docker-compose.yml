version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pms_password_1234
      POSTGRES_DB: production_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: pms-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:

# PostgreSQL for local testing only (production runs PostgreSQL directly on Windows Server).
# Port 5436 so it does not clash with the other project's database on 5435.
services:
  db:
    image: postgres:16-alpine
    container_name: zenhere-postgres
    environment:
      POSTGRES_USER: zenhere
      POSTGRES_PASSWORD: zenhere_dev
      POSTGRES_DB: zenhere
    ports:
      - "5436:5432"
    volumes:
      - zenhere-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenhere -d zenhere"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  zenhere-pgdata:
